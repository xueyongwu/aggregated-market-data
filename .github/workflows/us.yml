name: us-market

# 单独拆出来的原因见 CLAUDE.md: 美股的更新节奏跟 A 股那条完全对不上。
# 美股 16:00 ET 收盘 = 北京 04:00(夏)/05:00(冬), 腾讯日线当天早上就能取到。
on:
  schedule:
    # UTC 23:00 = 北京次日 07:00, 所以 1-5(UTC 周一~周五) = 北京周二~周六 07:00 ——
    # 一天一次, 正好一次盖住美股 5 个交易日的收盘, 无重复。别改成 0-4(北京周一~周五):
    # 北京周一 07:00 前最近的美股盘是周五, 行情与周六那次完全相同, 白跑一趟;
    # 且丢掉周六那次, 周末又回到挂 2 天半陈旧数据。
    #
    # 加密已拆去 crypto.yml —— 它 7x24, close 每跑都变, 留在这份里会让下面那道
    # `git diff --cached --quiet` 永远拦不住, 空跑照样 commit + deploy。
    #
    # 为什么是 07:00 不是 06:00: 收盘后腾讯日线约 2 小时可用(实测 UTC 22:00 那条常年
    # 跑通)。冬令时收盘是北京 05:00, 06:00 只剩 1 小时余量, 07:00 全年余量 >= 2 小时。
    # Actions cron 实测延迟 11~71 分钟, 落地在北京 07:10~08:15, 仍在余量内。
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # 触发 deploy.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python -m pipeline.stock.us_perf
      - name: commit & push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/data/us_data.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: us market update $(date -u +%F)"
          git pull --rebase
          git push
          gh workflow run deploy.yml
