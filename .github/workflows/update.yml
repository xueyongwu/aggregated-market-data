name: daily-update

on:
  schedule:
    - cron: "30 8 * * 1-5"  # UTC 08:30 = 北京 16:30; A 股已收盘, 且港股 16:00 已收盘(index_perf 的恒指两条)
    - cron: "0 10 * * 1-5"  # UTC 10:00 = 北京 18:00, 兜底重试; 国债活跃券(银行间 17:00 收)以这趟为准
  workflow_dispatch:          # 手动触发

permissions:
  contents: write
  actions: write  # 触发 deploy.yml(GITHUB_TOKEN 推的 commit 不会自动触发其他 workflow)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # nq_min 不进 git(每工作日被全量重写提交 2~3 次), 走 cache。
      # key 带 run_id 保证每次都存新的, restore-keys 前缀取最近一份; nq_night.yml 用同一 prefix。
      # 未命中不是故障: nq_min 缺了断一两天曲线, 次日 5:00 那趟补回。
      - uses: actions/cache@v4
        with:
          path: cache/nq_min.parquet
          key: stock-cache-v2-${{ github.run_id }}
          restore-keys: stock-cache-v2-
      - run: pip install pandas pyarrow akshare requests  # requests 各脚本主源都在用, 别靠 akshare 传递依赖
      # 排在 nq_overnight 前面: turnover_data.js 的日期兼任 A 股交易日历
      - run: python -m pipeline.stock.turnover_margin
        continue-on-error: true  # 同花顺/东财偶发失败不阻断, 页面用旧数据(各写各的, 一个挂了另一个照写)
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}  # 成交额走同花顺
      - run: python -m pipeline.stock.index_perf
        continue-on-error: true  # 指数源(新浪/中证/同花顺)偶发失败不阻断, 页面用旧数据
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}  # 微盘股/可转债那两条
      - run: python -m pipeline.stock.nq_overnight
        continue-on-error: true  # 新浪外盘接口偶发失败不阻断, 页面用旧数据
      - run: python -m pipeline.stock.bond_rate
        continue-on-error: true  # 中国货币网偶发失败不阻断, 页面用旧数据(卡片自带成交时间戳)
      - run: python -m pipeline.stock.qdii_premium
        continue-on-error: true  # 东财净值/腾讯日线偶发失败不阻断; 增量的, 断几天下次翻页补回
      - name: commit & push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/data/turnover_data.js app/src/data/margin_data.js \
                  app/src/data/idx_data.js \
                  app/src/data/nq_data.js app/src/data/bond_data.js \
                  app/src/data/qdii_premium_data.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily data update $(date -u +%F)"
          git pull --rebase
          git push
          gh workflow run deploy.yml
