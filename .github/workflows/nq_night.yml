name: nq-night

on:
  schedule:
    # UTC 21:00 = 北京 05:00。新浪 MinLine 只返回当前盘, 北京 06:00 切新盘,
    # 而 NQ 每日 05:00 收盘 —— 05:00~06:00 这一小时抓到的必是「刚收完的完整整夜盘」,
    # 天然容忍 GitHub Actions 常见的 10~50 分钟 cron 延迟。
    # 0-4 = UTC 周日~周四, 对应北京周一~周五凌晨(周一那次补的是上周五夜盘)。
    #
    # 双保险: 单条 cron 的容错只有 1 小时, 而 Actions 偶发延迟远不止。
    # 2026-08-28 实际发生: 这条 08:05 才起(迟到 3 小时), 旧盘早已切走,
    # 分时曲线从前一晚 21:32 断到 06:00。UTC 20:00 = 北京 04:00 那条抓的是
    # 半程夜盘(NQ 05:00 才收), bar 累积进 parquet, 05:00 那条会补齐尾巴 ——
    # 即使它再迟到, 也只缺 04:00~05:00 这一小时而不是整夜。
    - cron: "0 20 * * 0-4"
    - cron: "0 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # 触发 deploy.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 同 update.yml 的 prefix: 这里只读 daily_pctchg(交易日历)、只写 nq_min。
      - uses: actions/cache@v4
        with:
          path: |
            cache/daily_pctchg.parquet
            cache/nq_min.parquet
          key: stock-cache-v2-${{ github.run_id }}
          restore-keys: stock-cache-v2-
      - run: pip install pandas pyarrow requests
      - run: python -m pipeline.stock.nq_overnight
        # 未命中缓存时 trading_days() 读不到 daily_pctchg 会抛 —— 不让整个 job 红,
        # 等 daily-update 那趟把缓存建回来。A股休市期间这里本来也出不了隔夜数。
        continue-on-error: true
      - name: commit & push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/data/nq_data.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: nq night update $(date -u +%F)"
          git pull --rebase
          git push
          gh workflow run deploy.yml
