name: deploy

# 四条抓取 workflow 提交完数据后都会 `gh workflow run deploy.yml` 显式触发这里 ——
# GITHUB_TOKEN 推的 commit 不会自动触发别的 workflow，少了那一步页面永远是旧的。
# 数据现在是 Vite 的源文件（app/src/data/*.js），改了必须重新构建，不像从前静态页直接吃。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # 必须显式 ref: main。workflow_dispatch 下 checkout 默认取 github.sha ——
      # 那是 dispatch 时刻 GitHub 解析出的 SHA，抓取 workflow「push 完立刻 gh workflow run」
      # 只隔 2~3 秒，赶上复制延迟就解析成 push 前的 commit，deploy 绿着却构建了上一版数据
      # （2026-08-04 实际发生：nq night 的 1ffb194 没上线，页面 NQ 分时断档 00:43~06:00）。
      # 给了 ref 就是 job 起来时再解析 tip，那点延迟早过去了。
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
